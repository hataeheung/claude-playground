[project]
name = "agentic-coding-assistant"
version = "0.2.0"
description = "에이전틱 코딩 프로세스를 가이드하는 개인 어시스턴트 봇 + 자율 AI 개발 에이전트"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
]

[project.scripts]
acb = "acb.cli:main"

[tool.setuptools.packages.find]
include = ["acb*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
